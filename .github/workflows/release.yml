name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    # A release must not publish on a verify that skipped the relay's
    # production storage backend, so the release job gets the same real
    # Postgres as CI. See .github/workflows/ci.yml for why.
    services:
      postgres:
        # Matches Cloud SQL openagentsgemini:us-central1:khala-sync-pg
        # (POSTGRES_17), the instance behind relay.openagents.com.
        image: postgres:17
        env:
          # Throwaway, job-scoped, not a credential to anything persistent.
          POSTGRES_USER: nostr_effect_ci
          POSTGRES_PASSWORD: nostr_effect_ci
          POSTGRES_DB: nostr_effect_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nostr_effect_ci -d nostr_effect_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://nostr_effect_ci:nostr_effect_ci@127.0.0.1:5432/nostr_effect_ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm Postgres is reachable and is version 17
        run: node scripts/ci-postgres-preflight.mjs

      - name: Run tests
        run: pnpm run verify

      - name: Prove the Postgres suite actually exercised the database
        run: node scripts/ci-postgres-postflight.mjs

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "Error: package.json version ($PKG_VERSION) doesn't match tag (v${{ steps.version.outputs.VERSION }})"
            exit 1
          fi

      - name: Publish to npm (OIDC)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
