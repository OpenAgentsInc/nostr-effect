name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    # This workflow predates INVARIANTS.md "No GitHub-Hosted CI" and survives
    # only because it is currently the sole npm publish path (npm OIDC identity
    # + GitHub Release). Retiring it onto owned infrastructure is an owner
    # decision; see scripts/check-no-github-actions.ts. Do NOT add jobs,
    # triggers, or service containers here — new automation goes on our runners.
    #
    # The verify below therefore cannot provision a database: the full run
    # against a real Postgres 17 happens on owned infrastructure via
    # `pnpm run verify:postgres`, which `pnpm run release` runs before it will
    # cut the tag that triggers this workflow. That skip is stated out loud
    # rather than left to an unset variable.
    env:
      ALLOW_SKIPPED_INFRA_TESTS: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run verify

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "Error: package.json version ($PKG_VERSION) doesn't match tag (v${{ steps.version.outputs.VERSION }})"
            exit 1
          fi

      - name: Publish to npm (OIDC)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
